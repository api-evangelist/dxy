aid: dxy
name: DXY
description: >-
  DXY (丁香园) is China's leading digital healthcare technology company, founded in
  2000 in Harbin and headquartered in Hangzhou. It operates a "D+C" dual strategy:
  a professional physician community and clinical toolset (drug reference "用药助手",
  clinical case database, medical education, and the "Insight" pharmaceutical data
  analytics platform) alongside consumer health services under the "丁香医生"
  (Dingxiang Doctor) brand. DXY also runs the Biomart / 丁香通 life-sciences supplies
  marketplace. Its Medical Data Open Platform (open.dxy.cn) exposes standardized
  healthcare data services — newly-approved drugs, drug SKU and drug search, disease
  search, and hospital/institution search — as REST/JSON APIs under api.dxy.cn for
  pharmaceutical, medical, and health-tech partners. This profile was surfaced as a
  portfolio company of dcm-ventures and enriched by the API Evangelist pipeline.
